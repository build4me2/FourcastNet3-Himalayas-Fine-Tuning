# Tier-A v1.2b thick-2 RETRAIN — docs/research/TIER_A_V1_2B_THICK2_TRAIN_RECIPE.md
# Same ElevCondResidualUNet as v1.2b: base=16, dropout=0.20, w_120=2.0, patience=80.
# FCN3 weights FROZEN. Do NOT overwrite v1_2b/ (INTERIM PASS weights) or v1_2b_thick2/ (ZS).
# provisional_years=false; year_split_frozen=true (HARD); claim_level=interim_era5; g1_claimable=false
# Beat-this FROZEN thick-2: val < 1.988588 / test < 1.918383 / +120h <= 2.178842
# Leave CDS/ERA5 PID 611595 alone. No diffusion.

schema: tier_a_v1_2b_thick2_train_results/v1
method: RRCA-FD_Plan_A_frozen_fcn3_residual
tier: A
variant: v1_2b_thick2_train
cut: v1.2b-reg
diffusion: false
artifact_stem: tier_a_v1_2b_thick2_train
holdout_expand: v2
bars_set: thick2

locks:
  geo_box_frozen: true
  years_frozen: true          # HARD — Manisha year hard-lock 2026-09-13
  provisional_years: false
  year_split_frozen: true     # HARD lock
  precip_in_v1: false
  target: ERA5_interim
  claim_level: interim_era5
  g1_claimable: false
  fcn3_weights: FROZEN
  freeze_tier_a_v0: true
  freeze_tier_a_v0_1: true
  freeze_tier_a_v1: true
  freeze_tier_a_v1_1: true
  freeze_tier_a_v1_1_expand: true
  freeze_tier_a_v1_2: true
  freeze_tier_a_v1_2b: true           # frozen INTERIM PASS weights — do not overwrite
  freeze_tier_a_v1_2b_thick2: true    # frozen ZS results — do not overwrite
  no_diffusion: true
  no_fcn3_weight_ft: true
  train_pending_manisha_confirm: false
  train_pending_leonard_freeze: false  # Leonard recipe FROZEN 2026-09-14
  overwrite_forbidden:
    - runs/phase0/g0/g0_verifying_results.json
    - runs/phase0/tier0_holdout/
    - runs/phase0/tier0_holdout_expand/
    - runs/phase0/tier0_holdout_expand_v2/
    - runs/phase0/tier_a/v0/
    - runs/phase0/tier_a/v0_1/
    - runs/phase0/tier_a/v1/
    - runs/phase0/tier_a/v1_1/
    - runs/phase0/tier_a/v1_1_expand/
    - runs/phase0/tier_a/v1_2/
    - runs/phase0/tier_a/v1_2b/
    - runs/phase0/tier_a/v1_2b_thick2/

# Thick-2 beat-this FROZEN (Leonard HOLDOUT_THICK2_CALL.md + TIER_A_V1_2B_THICK2_TRAIN_RECIPE.md)
beat_this:
  val_t2m_pooled_rmse_lin_strict_lt: 1.988588
  val_headline_lt: 1.989
  test_t2m_pooled_rmse_lin_strict_lt: 1.918383
  val_120h_t2m_rmse_raw_le: 2.178841818082155
  val_120h_rule: "val +120h t2m RMSE <= thick-2-val raw (2.178842 K); hard gate; expand-v1 2.131516 historical only"
  source: runs/phase0/tier0_holdout_expand_v2/tier0_holdout_expand_v2_metrics.json
  call: docs/research/HOLDOUT_THICK2_CALL.md
  recipe: docs/research/TIER_A_V1_2B_THICK2_TRAIN_RECIPE.md
  bars_set: thick2
  note: "primary=val strict < 1.988588; secondary=test strict < 1.918383; +120h <= thick-2 raw 2.178842; n_eligible_saves>=1 required; unconstrained fallback=auto FAIL; expand-v1/thin bars historical only"
  expand_v1_historical:
    val_t2m_pooled_rmse_lin_strict_lt: 1.987014
    test_t2m_pooled_rmse_lin_strict_lt: 1.897298
    val_120h_t2m_rmse_raw_le: 2.131515989123864
    note: historical HOLDOUT_EXPAND_CALL.md / expand 8/12/12 only
  thin_historical:
    val_t2m_pooled_rmse_lin_strict_lt: 1.948661
    test_t2m_pooled_rmse_lin_strict_lt: 1.850338
    val_120h_t2m_rmse_raw_le: 2.219970831929039
    note: historical v0/v0.1/v1/v1.1 thin calls only
  g0_adapter:
    baseline: runs/phase0/g0/g0_verifying_results.json
    rule: "≤~5% CRPS degrade midlat @ +15 d; PSD/SSR floors"
    tier_a_status: not_applicable_fcn3_frozen

year_split:
  train: "2018-2021"
  val: "2022"
  test: "2023-2024"
  train_ids: [ic01, ic02, ic03, ic04, ic05, ic06, ic07, ic08, ic33, ic34, ic35, ic36]
  val_ids: [ic09, ic10, ic11, ic12, ic17, ic18, ic19, ic20, ic21, ic22, ic23, ic24, ic37, ic38, ic39, ic40]
  test_ids: [ic13, ic14, ic15, ic16, ic25, ic26, ic27, ic28, ic29, ic30, ic31, ic32, ic41, ic42, ic43, ic44]

region:
  lat_lon_box: {lon_west: 80.0, lon_east: 89.0, lat_south: 26.0, lat_north: 31.0}

data:
  pairs_dir: ~/fourcastnet/runs/phase0/tier0_holdout_expand_v2/pairs
  ic_manifest: ~/fourcastnet/data/tier0_ics/tier0_ic_manifest.json
  elevation_mask: ~/fourcastnet/data/masks/w_R_elevation.nc
  holdout_metrics: ~/fourcastnet/runs/phase0/tier0_holdout_expand_v2/tier0_holdout_expand_v2_metrics.json
  g0_verifying: ~/fourcastnet/runs/phase0/g0/g0_verifying_results.json

variables_in: [t2m, u10m, v10m]
variables_out: [t2m, u10m, v10m]
leads_h: [24, 72, 120]

# Same arch as v1.2b (base=16, dropout=0.20); w_120=2.0, patience=80, seed=42.
model:
  name: ElevCondResidualUNet
  in_channels: 5   # pred_t2m, pred_u10m, pred_v10m, elev_norm, lead_norm
  out_channels: 3
  base_channels: 16
  depth: 3
  cond_dim: 2      # FiLM from (lead_norm, mean elev_norm)
  dropout: 0.20
  approx_params: "≈0.17M (same as v1.2b; ~168k)"

train:
  epochs_smoke: 30
  epochs_full: 400
  batch_size: 8
  lr: 5.0e-4
  weight_decay: 1.0e-3
  seed: 42
  loss: mse_residual_elev_weighted_lead_weighted
  lead_balance: true
  w_120: 2.0
  lead_weights:
    24: 1.0
    72: 1.0
    120: 2.0
  channel_weights: [2.0, 0.5, 0.5]   # t2m-upweight (gates are t2m)
  ckpt_select: composite
  composite:
    primary: lead_mean
    constraint: val_120h_le_raw
    reject_if_constraint_fails: true
    also_track_pooled: true
  raw_val_120h_t2m_rmse: 2.178841818082155  # thick-2 val raw +120h (LOCKED)
  early_stop_patience: 80
  elev_weight_boost: 1.5
  device_smoke: cpu
  device_full: cuda         # Manisha greenlit; leave ERA5 PID 611595 alone

output_dir: ~/fourcastnet/runs/phase0/tier_a/v1_2b_thick2_train

notes:
  parent_call: docs/research/HOLDOUT_THICK2_CALL.md
  recipe: docs/research/TIER_A_V1_2B_THICK2_TRAIN_RECIPE.md
  status: living_residual_interim_pass_confirm_yes_idle_no_diffusion
  parent_zs: runs/phase0/tier_a/v1_2b_thick2/
  honesty: >
    Tier-A v1.2b thick-2 retrain = same ElevCondResidualUNet as v1.2b
    (base_channels=16, dropout=0.20) on holdout_expand=v2 pairs (train 12 /
    val 16 / test 16) with w_120=2.0 and early_stop_patience=80. PASS LOCKED:
    n_eligible_saves >= 1 required; unconstrained +120h fallback => automatic
    FAIL even if pooled numbers clear. NOT diffusion; NOT FCN3 weight FT;
    NOT G1/IMDAA. v1_2b/ and v1_2b_thick2/ remain frozen.

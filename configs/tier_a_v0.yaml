# Tier-A v0 — Frozen FCN3 + tiny elevation-aware residual head (RRCA-FD Plan A)
# Leonard TIER0_HOLDOUT_CALL.md: Tier-A eng GO. Beat-this FROZEN — echo in all result JSON.
# NOT full FCN3 weight FT. NOT MSE-only dynamics claims (this is a diagnostic residual).
# provisional_years=true; claim_level=interim_era5; g1_claimable=false

schema: tier_a_v0/v1
method: RRCA-FD_Plan_A_frozen_fcn3_residual
tier: A
variant: v0_tiny_unet_residual

locks:
  geo_box_frozen: true
  years_frozen: true          # PROVISIONAL — Manisha hard-lock TBD
  provisional_years: true
  year_split_frozen: true     # provisional label
  precip_in_v1: false         # t2m/winds-first
  target: ERA5_interim
  claim_level: interim_era5
  g1_claimable: false
  fcn3_weights: FROZEN
  overwrite_forbidden:
    - runs/phase0/g0/g0_verifying_results.json
    - runs/phase0/tier0_holdout/

# Frozen beat-this (echo verbatim in every result JSON)
beat_this:
  val_t2m_pooled_rmse_lin_strict_lt: 1.948661
  val_headline_lt: 1.949
  test_t2m_pooled_rmse_lin_strict_lt: 1.850338
  source: runs/phase0/tier0_holdout/tier0_holdout_metrics.json
  call: docs/research/TIER0_HOLDOUT_CALL.md
  note: "val-only win = FAIL; must also beat test bar"
  g0_adapter:
    baseline: runs/phase0/g0/g0_verifying_results.json
    rule: "≤~5% CRPS degrade midlat @ +15 d; PSD/SSR floors"
    tier_a_v0_status: not_applicable_fcn3_frozen  # diagnostic does not touch FCN3

year_split:
  train: "2018-2021"
  val: "2022"
  test: "2023-2024"
  train_ids: [ic01, ic02, ic03, ic04, ic05, ic06, ic07, ic08]
  val_ids: [ic09, ic10, ic11, ic12]
  test_ids: [ic13, ic14, ic15, ic16]

region:
  lat_lon_box: {lon_west: 80.0, lon_east: 89.0, lat_south: 26.0, lat_north: 31.0}

data:
  pairs_dir: ~/fourcastnet/runs/phase0/tier0_holdout/pairs
  ic_manifest: ~/fourcastnet/data/tier0_ics/tier0_ic_manifest.json
  elevation_mask: ~/fourcastnet/data/masks/w_R_elevation.nc
  holdout_metrics: ~/fourcastnet/runs/phase0/tier0_holdout/tier0_holdout_metrics.json
  g0_verifying: ~/fourcastnet/runs/phase0/g0/g0_verifying_results.json

variables_in: [t2m, u10m, v10m]     # conditioner channels from FCN3 crop ens_mean
variables_out: [t2m, u10m, v10m]    # residual targets (ERA5 − FCN3)
leads_h: [24, 72, 120]

model:
  name: TinyElevResidualUNet
  in_channels: 5   # pred_t2m, pred_u10m, pred_v10m, elev_norm, lead_norm
  out_channels: 3
  base_channels: 16
  depth: 2

train:
  epochs_smoke: 30
  epochs_full: 300
  batch_size: 8
  lr: 1.0e-3
  weight_decay: 1.0e-4
  seed: 42
  loss: mse_residual_elev_weighted   # diagnostic residual; not CRPS/dynamics claim
  elev_weight_boost: 1.5             # mild upweight high elev bins
  device_smoke: cpu                  # leave ERA5 PID / GPU alone for smoke
  device_full: cuda

output_dir: ~/fourcastnet/runs/phase0/tier_a/v0

notes:
  honesty: >
    Tier-A v0 = frozen FCN3 crop + tiny residual UNet toward ERA5_interim.
    Not CorrDiff/StormCast yet; not FCN3 weight FT; not G1/IMDAA.
    Beat Tier-0 val+test bars to claim interim PASS; G0 adapter N/A while FCN3 frozen.

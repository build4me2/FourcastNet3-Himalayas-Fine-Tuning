# Leonard TIER_A_V1_2_CALL.md: w_120=2.0, patience=80, n_eligible_saves>=1 required.
# FCN3 weights FROZEN. Do NOT overwrite v0/, v0_1/, v1/, v1_1/, v1_1_expand/, v1_2/.

# Tier-0 holdout IC split (YEAR HARD-LOCK 2026-09-13 — see docs/research/YEAR_HARD_LOCK.md)
# provisional_years=false; year_split_frozen=true (HARD)
# Global ERA5 ICs only (721×1440×72). Nepal crop ≠ IC.
# Train: reuse existing G0 ICs 2018–2021. Val 2022. Test 2023–2024.
# holdout_expand: v1 (2026-09-12 Leonard HOLDOUT_IC_EXPAND_RECIPE.md)
# Expand v1: train 8 / val 12 / test 12 (ic17–ic32).
# Thick-2 v2: train 12 / val 16 / test 16 (add ic33–ic44). Seasons ≥4 in val/test; train ≥2/season.
# Manisha: expand holdout first; no year hard-lock; no diffusion. 1980→latest ERA5 crop untouched.

out_dir: ~/fourcastnet/data/tier0_ics
source: arco
init_hour_utc: 0
provisional_years: false
year_split_frozen: true  # HARD — Manisha year hard-lock 2026-09-13
holdout_expand: v2  # Leonard FCN_NEXT_UNLOCK.md unlock A thick-2 (12/16/16) 2026-09-13
# Prior expand v1 kept (ic17–ic32). Thick-2 adds ic33–ic44.
year_split:
  train: [2018, 2019, 2020, 2021]
  val: [2022]
  test: [2023, 2024]
grid:
  nlat: 721
  nlon: 1440
  channels: 72

